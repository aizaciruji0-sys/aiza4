<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000">
  <title>APEX</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
  <script>try{var t=localStorage.theme;if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
  <header id="h">
    <button data-a="menu">≡</button>
    <input type="search" id="q" placeholder="Cari..." autocomplete="off">
    <button data-a="scan" title="Scan Barcode / QR">📷</button>
    <button data-a="refresh" title="Refresh &amp; Sync">⟳</button>
    <button data-a="add">add</button>
  </header>
  <p id="msg" data-a="closemsg" hidden></p>
  <div id="scan-box" hidden>
    <video id="scan-vid" playsinline></video>
    <button data-a="stop-scan">✕ Tutup Scanner</button>
  </div>
  <main id="main">
    <div id="tools">
      <select id="sh-sel" data-a="sh-sel"></select>
      <select id="st-sel" data-a="st-sel"></select>
      <button data-a="dir">^</button>
      <button data-a="grid">#</button>
      <select id="act-sel" data-a="act-sel">
        <option value="" disabled selected>act</option>
        <option value="edit">edit</option>
        <option value="tsv">tsv export</option>
        <option value="imp">import</option>
        <option value="bulksheet">bulksheet</option>
        <option value="schema">schema</option>
        <option value="clear">clear</option>
      </select>
    </div>
    <div id="box-form"></div>
    <div id="box-dash"></div>
    <div id="box-nota"><pre id="tape"></pre></div>
    <div id="list"></div>
  </main>
  <footer id="ft"></footer>
  <input id="f-cam" type="file" accept="image/*" capture="environment" hidden>
  <input id="f-img" type="file" accept="image/*" hidden>
  <input id="f-doc" type="file" hidden>
  <input id="f-imp" type="file" accept=".tsv,.txt,.csv" hidden>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
